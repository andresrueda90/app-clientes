name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      APP_PORT: 5000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Construir imágenes
        run: docker compose build

      - name: Levantar servicios
        run: docker compose up -d

      - name: Prueba de Status
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/health && break
            sleep 2
          done
          curl -sf -X POST http://localhost:5000/clientes \
            -H "Content-Type: application/json" \
            -d '{"identificacion":"1033650666","nombre":"Pedro","apellidos":"Perez"}'
          curl -sf http://localhost:5000/clientes | grep "Pedro"

      - name: Mostrar logs si falla
        if: failure()
        run: docker compose logs

      - name: Apagar
        if: always()
        run: docker compose down -v